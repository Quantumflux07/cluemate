<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">ClueMate — Think together</title>
  <desc id="desc">A neon dark banner with four answer tiles and a rotating dotted highlight around option B.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B13"/>
      <stop offset="0.55" stop-color="#10152A"/>
      <stop offset="1" stop-color="#080D16"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A78BFA" stop-opacity=".8"/>
      <stop offset="1" stop-color="#FB7185" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowCyan" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPink" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8DA2C8" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1400" height="430" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="430" rx="28" fill="url(#grid)"/>
  <circle cx="1170" cy="95" r="150" fill="#7C3AED" opacity=".10"/>
  <circle cx="180" cy="380" r="185" fill="#0EA5E9" opacity=".09"/>
  <path d="M0 330 C280 260 430 440 720 350 S1160 270 1400 330" fill="none" stroke="url(#line)" stroke-width="2"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="72" y="60" width="188" height="34" rx="17" fill="#131C2D" stroke="#2D3C56"/>
    <circle cx="91" cy="77" r="5" fill="#34D399"/>
    <text x="106" y="82" fill="#C4D2E7" font-size="13" font-weight="700" letter-spacing="2.2">LIVE CONSENSUS</text>
    <text x="68" y="184" fill="#F8FAFC" font-size="76" font-weight="850" letter-spacing="-3">Clue<tspan fill="url(#headline)">Mate</tspan></text>
    <text x="74" y="231" fill="#C8D4E6" font-size="26" font-weight="500">Think together. Commit with confidence.</text>
    <text x="75" y="279" fill="#8192AE" font-size="16" letter-spacing="1.2">REAL-TIME GROUP VOTING  /  SHARED SIGNAL  /  ZERO GUESSWORK</text>
    <rect x="75" y="316" width="255" height="42" rx="21" fill="#111A2A" stroke="#263650"/>
    <text x="202" y="342" fill="#9FB4D2" font-size="14" font-weight="650" text-anchor="middle">EXPO · TYPESCRIPT · SUPABASE</text>
    <g transform="translate(850 102)">
      <text x="0" y="-24" fill="#8CA0BE" font-size="12" font-weight="750" letter-spacing="2.4">THE ROOM'S CURRENT LEADER</text>
      <g transform="translate(0 0)">
        <rect x="0" y="0" width="102" height="124" rx="23" fill="#12243A" stroke="#38BDF8" stroke-opacity=".65" stroke-width="1.6"/>
        <text x="51" y="56" text-anchor="middle" fill="#7DD3FC" font-size="38" font-weight="850">A</text>
        <text x="51" y="86" text-anchor="middle" fill="#8EA6C5" font-size="12">OPTION</text>
        <text x="51" y="105" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="750">01</text>
      </g>
      <g transform="translate(119 0)" filter="url(#glowPink)">
        <rect x="0" y="0" width="102" height="124" rx="23" fill="#2A1727" stroke="#FB7185" stroke-width="2"/>
        <rect x="-5" y="-5" width="112" height="134" rx="27" fill="none" stroke="#FB7185" stroke-width="2.5" stroke-dasharray="4 7" stroke-linecap="round" transform="rotate(-6 51 62)"/>
        <text x="51" y="56" text-anchor="middle" fill="#FDA4AF" font-size="38" font-weight="850">B</text>
        <text x="51" y="86" text-anchor="middle" fill="#D9A1B1" font-size="12">LEADER</text>
        <text x="51" y="105" text-anchor="middle" fill="#FB7185" font-size="12" font-weight="750">TOP</text>
      </g>
      <g transform="translate(238 0)">
        <rect x="0" y="0" width="102" height="124" rx="23" fill="#122A28" stroke="#34D399" stroke-opacity=".65" stroke-width="1.6"/>
        <text x="51" y="56" text-anchor="middle" fill="#6EE7B7" font-size="38" font-weight="850">C</text>
        <text x="51" y="86" text-anchor="middle" fill="#8EA6B4" font-size="12">OPTION</text>
        <text x="51" y="105" text-anchor="middle" fill="#34D399" font-size="12" font-weight="750">03</text>
      </g>
      <g transform="translate(357 0)">
        <rect x="0" y="0" width="102" height="124" rx="23" fill="#2B2119" stroke="#FB923C" stroke-opacity=".65" stroke-width="1.6"/>
        <text x="51" y="56" text-anchor="middle" fill="#FDBA74" font-size="38" font-weight="850">D</text>
        <text x="51" y="86" text-anchor="middle" fill="#BBA28D" font-size="12">OPTION</text>
        <text x="51" y="105" text-anchor="middle" fill="#FB923C" font-size="12" font-weight="750">04</text>
      </g>
      <path d="M50 155 H410" stroke="#35445E" stroke-width="1.5"/>
      <circle cx="52" cy="155" r="4" fill="#38BDF8"/>
      <circle cx="171" cy="155" r="4" fill="#FB7185" filter="url(#glowPink)"/>
      <circle cx="290" cy="155" r="4" fill="#34D399"/>
      <circle cx="409" cy="155" r="4" fill="#FB923C"/>
      <text x="230" y="188" fill="#7F91AE" text-anchor="middle" font-size="13">When the consensus shifts, the signal shifts.</text>
    </g>
    <text x="1325" y="397" fill="#465570" text-anchor="end" font-size="12" letter-spacing="2">CLUE / 001</text>
  </g>
</svg>
